name: Update image manifest
on:
  push:
    paths: ['static/**', 'scroll/**']
    branches: [main]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manifests
        run: |
          python3 - <<'PY'
          import os, json, re
          ext = re.compile(r'\.(png|jpe?g|gif|webp|avif|svg|bmp)$', re.I)
          names = lambda d: sorted(f for f in os.listdir(d) if ext.search(f))
          json.dump(names('static'), open('images.json', 'w'), indent=2)
          with open('scroll/files.js', 'w') as fh:
              fh.write('// generated by .github/workflows/manifest.yml - do not edit by hand\n')
              fh.write('window.NOCOM_SCROLL = ' + json.dumps(names('scroll')) + ';\n')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images.json scroll/files.js
          git diff --cached --quiet || (git commit -m "Update image manifests" && git push)
